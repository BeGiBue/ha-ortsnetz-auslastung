name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub-Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Versionen prüfen
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          MANIFEST="$(jq -r .version custom_components/ortsnetz_map/manifest.json)"
          FILE="$(tr -d '[:space:]' < VERSION)"
          CARD="$(head -n 1 custom_components/ortsnetz_map/www/ortsnetz-map-card.js)"
          FAILED=0
          [ "$MANIFEST" = "$VERSION" ] || { echo "::error::manifest.json hat $MANIFEST, Tag ist $TAG"; FAILED=1; }
          [ "$FILE" = "$VERSION" ] || { echo "::error::VERSION hat $FILE, Tag ist $TAG"; FAILED=1; }
          [ "$CARD" = "// Ortsnetz Map Card v$VERSION" ] || { echo "::error::Card-Kopfzeile ist '$CARD', Tag ist $TAG"; FAILED=1; }
          exit $FAILED
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits (z. B. von Hand angelegt), nichts zu tun."
            exit 0
          fi
          VERSION="${TAG#v}"
          NOTES="RELEASE_NOTES_${VERSION}.md"
          ARGS=(--title "$VERSION" --verify-tag)
          if [ -f "$NOTES" ]; then ARGS+=(--notes-file "$NOTES"); else ARGS+=(--generate-notes); fi
          if [[ "$VERSION" == *-* ]]; then ARGS+=(--prerelease); fi
          gh release create "$TAG" "${ARGS[@]}"
